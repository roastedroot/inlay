name: Publish Wasm to OCI

on:
  workflow_call:
    inputs:
      wasm-file:
        description: 'Path to the .wasm file to publish'
        required: true
        type: string
      image-ref:
        description: 'OCI image reference (e.g. ghcr.io/roastedroot/sqlite4j-wasm)'
        required: true
        type: string
      version:
        description: 'Version tag (e.g. 3.51.0)'
        required: true
        type: string
      sign:
        description: 'Sign with cosign (keyless via OIDC)'
        required: false
        type: boolean
        default: true
      oras-version:
        description: 'ORAS CLI version'
        required: false
        type: string
        default: '1.2.2'
      cosign-version:
        description: 'Cosign version (v3+ required: on v2.x, sign-blob needs --new-bundle-format)'
        required: false
        type: string
        default: 'v3.1.2'

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install ORAS
        uses: oras-project/setup-oras@v1
        with:
          version: ${{ inputs.oras-version }}

      - name: Install cosign
        if: inputs.sign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: ${{ inputs.cosign-version }}

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push wasm artifact
        run: |
          oras push \
            "${{ inputs.image-ref }}:${{ inputs.version }}" \
            "${{ inputs.wasm-file }}:application/wasm"

          oras push \
            "${{ inputs.image-ref }}:latest" \
            "${{ inputs.wasm-file }}:application/wasm"

      # sign-blob, not sign: sigstore-java cannot yet parse cosign's DSSE payloads.
      - name: Sign with cosign and attach the bundle
        if: inputs.sign
        run: |
          BUNDLE="$(basename "${{ inputs.wasm-file }}").sigstore.json"

          cosign sign-blob --yes \
            --bundle "$BUNDLE" \
            "${{ inputs.wasm-file }}"

          for tag in "${{ inputs.version }}" latest; do
            oras attach \
              --artifact-type application/vnd.dev.sigstore.bundle.v0.3+json \
              "${{ inputs.image-ref }}:${tag}" \
              "$BUNDLE:application/vnd.dev.sigstore.bundle.v0.3+json"
          done
